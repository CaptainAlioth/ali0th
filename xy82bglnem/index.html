<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Station Bill Generator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Station Bill">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: shipboard safety signage, clear and calm
   IDEA: the laminated muster card in the cabin frame
   PICTURE: the A4 card itself, live, with red alarm signals
   COLOUR and TYPE: paper white, ink, signal red; Barlow / Barlow Condensed
   LAYOUT: phone first, bottom tabs, preview on top, editors below */
:root{--sans:Barlow,"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;--cond:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,Arial,sans-serif;color-scheme:light dark;--bg:light-dark(#e9ecef,#101317);--card:light-dark(#fff,#1b2026);--ink:light-dark(#14181d,#e8ebee);--mut:light-dark(#5b636d,#9aa3ad);--line:light-dark(#d5d9de,#2e353d);--red:#d42a20;--redbg:light-dark(#fdecea,#3a1714);--bar:#14181d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font:600 20px/1.1 var(--cond);margin:0;letter-spacing:.2px;flex:1}
header.top .sub{font-size:13px;color:#aab3bd;display:block;font-weight:400;font-family:var(--sans)}
.sig{display:inline-flex;gap:3px;align-items:center}.sig i{display:block;height:5px;width:7px;background:var(--red);border-radius:1px}.sig i.l{width:22px}
#saved{font-size:12px;color:#7fd18b;opacity:0;transition:opacity .3s}#saved.on{opacity:1}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{border:0;background:none;color:var(--mut);font:500 13px var(--sans);padding:8px 2px 9px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--red)}
h2{font:600 24px/1.1 var(--cond);margin:6px 0 12px}
h3{font:600 18px/1.2 var(--cond);margin:0 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:1 1 140px}
.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{font:16px var(--sans);color:var(--ink);background:light-dark(#fff,#12161a);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:44px}
textarea{min-height:84px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--red)}
button.b{font:600 15px var(--sans);min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--red);border-color:var(--red);color:#fff}
button.d{color:var(--red)}button.d[data-armed]{background:var(--red);color:#fff}
button.s{min-height:38px;padding:4px 10px;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:600 15px var(--sans);min-height:44px}.seg button.on{background:var(--bar);color:#fff}
.hint{font-size:13px;color:var(--mut)}
.warn{background:var(--redbg);color:var(--red);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0}
.list{border-top:1px solid var(--line)}.li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.li .nm{flex:1;font-weight:600}.li .tag{font-size:12px;color:var(--mut)}
.badge{display:inline-block;font:600 12px var(--sans);padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--mut)}
.team{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.mem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.mem .full{grid-column:1/-1}
.assign{border-left:3px solid var(--red);padding:2px 0 2px 10px;margin:8px 0}
.cnt{font-size:12px;color:var(--mut);text-align:right}.cnt.over{color:var(--red);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pvw{overflow:hidden;margin:0 0 12px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.08)}
.pvs{transform-origin:0 0;width:210mm}
#print{position:absolute;left:-10000px;top:0;width:210mm}

/* ---------- PAPER ---------- */
.a4{--sans:Barlow,"Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,Arial,sans-serif;width:210mm;background:#fff;color:#111;font:10pt/1.3 var(--sans);padding:12mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4.card{height:297mm;display:flex;flex-direction:column}
.a4 .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.9mm solid #111;padding-bottom:2.5mm}
.a4 .ship{font:700 15pt/1.05 var(--cond);text-transform:uppercase}
.a4 .ids{font-size:9pt;color:#444;margin-top:1mm}
.a4 .ttl{text-align:right}.a4 .ttl .k{font:700 11pt var(--cond);letter-spacing:.4px}.a4 .ttl .s2{font-size:9pt;color:#444}
.a4 .rank{font:700 26pt/1 var(--cond);margin-top:1mm}
.a4 .alarm{border:.4mm solid var(--red);border-radius:1.5mm;padding:2mm 3mm;margin-top:3mm;display:grid;gap:1.6mm}
.a4 .al h4{margin:0;font:700 12pt var(--cond);color:var(--red);text-transform:uppercase;letter-spacing:.3px}
.a4 .al svg{display:block;width:100%;height:3.4mm;margin:.8mm 0}
.a4 .al p{margin:0;font-size:10pt;color:#222}
.a4 .cbody{flex:1;min-height:0;overflow:hidden;margin-top:2.5mm}
.a4 .cols{display:grid;grid-template-columns:1fr 1fr;gap:5mm;height:100%}.a4 .col{overflow:hidden;min-height:0}
.a4 .en{border-bottom:.25mm solid #bbb;padding:2.2mm 0;break-inside:avoid}
.a4 .enh{display:flex;justify-content:space-between;align-items:center;gap:2mm;font:700 13.5pt var(--cond);text-transform:uppercase}
.a4 .enh .rt{font:600 9.5pt var(--sans);color:var(--red);text-transform:none;display:flex;align-items:center;gap:1.5mm}
.a4 .enh .rt svg{width:16mm;height:2.6mm}
.a4 ol.as{margin:1mm 0 0;padding-left:4.5mm}.a4 ol.as.one{list-style:none;padding-left:0}
.a4 .as li{margin:.8mm 0}
.a4 .tm{font-size:10pt;color:#333;margin-top:.6mm}
.a4 .du{font-weight:700;font-size:12pt;line-height:1.25;margin-top:.5mm}
.a4 .cd{color:var(--red);font-weight:700}
.a4 .kn{background:#eeeeee;border-radius:1mm;padding:1.5mm 2.2mm;margin-top:1.5mm;font-size:10.5pt;line-height:1.3;color:#111}
.a4.f1 .en{padding:1.4mm 0}.a4.f1 .alarm{padding:1.5mm 2.5mm;gap:1mm}.a4.f1 .kn{padding:.9mm 1.6mm;margin-top:.9mm}
.a4.f2 .kn{font-size:9.5pt}.a4.f2 .tm{font-size:9pt}.a4.f2 .du{font-size:10.5pt}.a4.f2 .enh{font-size:12pt}.a4.f2 .mb{font-size:8.5pt}.a4.f2 .al p{font-size:9pt}
.a4.f3 .al p{font-size:8.5pt}.a4.f3 table.sg td{height:7.2mm}.a4.f3 .kn{line-height:1.2}.a4.f3 .enh{font-size:10.5pt}.a4.f3 .as li{margin:.4mm 0}.a4.f3 .ph{padding-bottom:1.5mm}.a4.f3 .rank{font-size:22pt}
.a4.f4 .kn{font-size:9pt;padding:.6mm 1.4mm}.a4.f4 .du{font-size:9.5pt;line-height:1.22}.a4.f4 .tm{font-size:8pt}.a4.f4 table.sg td{height:6.6mm}.a4.f4 .en{padding:1mm 0}.a4.f4 .alarm{margin-top:2mm}
.a4 .sigw{margin-top:2.5mm}
.a4 .sigw .st{font-weight:700;font-size:11pt;margin-bottom:1.2mm}
.a4 table.sg{width:100%;border-collapse:collapse;table-layout:fixed}
.a4 table.sg th{background:#111;color:#fff;font:600 9pt var(--sans);text-align:left;padding:1.2mm 2mm}
.a4 table.sg td{border:.25mm solid #888;height:8.5mm}
.a4 .pf{display:flex;justify-content:space-between;font-size:8.5pt;color:#555;margin-top:2mm}
/* seat */
.a4 .phr{display:flex;align-items:flex-end;gap:3mm;flex:none}
.a4 .ph>div:first-child{flex:1;min-width:0}
.a4 .seat{width:23mm;height:23mm;border:1.2mm solid var(--red);border-radius:1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.a4 .seat small{font:700 7.5pt var(--cond);letter-spacing:.3px;color:var(--red);text-transform:uppercase;text-align:center;line-height:1.05}
.a4 .seat b{font:700 30pt/1 var(--cond);color:#111}
.a4 .sp{display:grid;grid-template-columns:88mm 1fr;gap:4mm;margin-top:3mm;align-items:start}
.a4 .sp svg{width:100%;height:auto;display:block}
.a4 table.st{width:100%;border-collapse:collapse;font-size:9.5pt}
.a4 table.st th{background:#111;color:#fff;text-align:left;font:600 8.5pt var(--sans);padding:1mm 2mm}
.a4 table.st td{border:.25mm solid #999;padding:.3mm 1.4mm;font-size:8.8pt;line-height:1.25}
.a4 table.st td:first-child{width:12mm;text-align:center;font-weight:700;color:var(--red)}
.a4 table.st tr.sp0 td{color:#888}
/* liferaft square + muster badges */
.a4 .seat.raft{border-color:#111}.a4 .seat.raft small{color:#111}.a4 .seat.raft b{font-size:19pt;margin:.6mm 0}.a4 .seat.raft i{font:600 7pt var(--sans);font-style:normal;color:#444}
.a4 .mb{display:inline-block;background:#111;color:#fff;font:700 10pt/1.3 var(--cond);text-transform:uppercase;letter-spacing:.3px;padding:.2mm 1.6mm;border-radius:.8mm;margin-right:1.2mm;vertical-align:baseline}
.a4 .mb::before{content:"MUSTER ";color:#ff8a80}
.a4 .mbig{display:flex;align-items:center;gap:3mm;border:.6mm solid #111;margin-top:2.5mm}
.a4 .mbig .l{background:#111;color:#fff;font:700 10pt/1.1 var(--cond);text-transform:uppercase;padding:2mm 3mm;align-self:stretch;display:flex;align-items:center}
.a4 .mbig .v{font:700 14pt/1.15 var(--cond);text-transform:uppercase;padding:1.5mm 0}
.a4 .tbh .tm2{background:#111;color:#fff;font:700 8.5pt var(--cond);text-transform:uppercase;padding:.3mm 2mm;border-radius:.8mm;white-space:nowrap}
.a4 .rf{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:3mm}
.a4 .rf .bx{border:.5mm solid #111}
.a4 .rf h4{margin:0;background:#111;color:#fff;font:700 13pt "Barlow Condensed",var(--cond);text-transform:uppercase;padding:2mm 3mm}
.a4 .rf .loc{font:600 10pt var(--sans);padding:1.5mm 3mm;border-bottom:.3mm solid #999}
.a4 .rf ol{margin:0;padding:2mm 3mm 2mm 9mm;font-size:10.5pt;line-height:1.55}
/* side colours: port red, starboard green */
.a4 .seat.P{border-color:#d42a20}.a4 .seat.P b,.a4 .seat.P small,.a4 .seat.P i{color:#d42a20}
.a4 .seat.S{border-color:#178a3a}.a4 .seat.S b,.a4 .seat.S small,.a4 .seat.S i{color:#178a3a}
.a4 .seat.N{border-color:#111}.a4 .seat.N small{color:#111}
.a4 .bicon{display:flex;flex-direction:column;align-items:center;flex:none;width:14mm}
.a4 .bicon svg{width:11mm;height:17mm;display:block}
.a4 .bicon small{font:700 7pt/1.1 var(--cond);text-transform:uppercase;text-align:center;margin-top:.5mm}
.a4 .sideP{color:#d42a20}.a4 .sideS{color:#178a3a}
.a4 .rf .bx.P{border-color:#d42a20}.a4 .rf .bx.P h4{background:#d42a20}.a4 .rf .bx.S{border-color:#178a3a}.a4 .rf .bx.S h4{background:#178a3a}
.a4 .seat.LB{border-color:var(--c,#111);width:27mm}.a4 .seat.LB small{font-size:8pt}.a4 .seat.LB b,.a4 .seat.LB small{color:var(--c,#111)}.a4 .lbc{color:#E06A00}
.a4 .grp{display:flex;align-items:flex-end;gap:2mm}.a4 .grp+.grp{border-left:.4mm solid #bbb;padding-left:5mm;margin-left:2mm}
.a4 .bicon.lb small{color:#111}
/* bills */
.a4.bill{min-height:297mm}
.a4 .band{background:#111;color:#fff;font:700 15pt/1.1 var(--cond);text-transform:uppercase;letter-spacing:.5px;padding:2mm 3mm;margin-top:3mm;text-align:center}
.a4 .meta{margin-top:2.5mm;font-size:9.5pt;display:grid;gap:.8mm}
.a4 .meta b{text-transform:uppercase;font-family:var(--cond);font-size:10pt}
.a4 .imm{border:.35mm solid #111;padding:2mm 3mm;margin-top:2.5mm;font-size:9.5pt}
.a4 .tb{margin-top:3mm;break-inside:avoid}
.a4 .tbh{background:#d9d9d9;font:700 11pt var(--cond);text-transform:uppercase;padding:1.3mm 2.5mm;display:flex;justify-content:space-between;gap:3mm}
.a4 .tbh span{font:500 9pt var(--sans);text-transform:none}
.a4 .tbt{font-size:9pt;padding:1.3mm 2.5mm;border-left:.25mm solid #999;border-right:.25mm solid #999;white-space:pre-line}
.a4 table.dt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.5pt}
.a4 table.dt th{background:#111;color:#fff;text-align:left;font:600 8.5pt var(--sans);padding:1mm 2.5mm}
.a4 table.dt td{border:.25mm solid #999;padding:1.1mm 2.5mm;vertical-align:top}
.a4 table.dt td:first-child{width:34%}
.a4 .ld{font-weight:700}.a4 .alt{font-size:8.5pt;color:#444}.a4 .rs{font-size:8pt;color:#555;display:block}
.a4 .ins{margin-top:3mm;border:.35mm solid #111;padding:2mm 3mm;font-size:9.5pt;white-space:pre-line;break-inside:avoid}
.a4 .ins h5{margin:0 0 1mm;font:700 10.5pt var(--cond);text-transform:uppercase}
.a4 table.eq{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;margin-top:1mm}
.a4 table.eq th,.a4 table.eq td{border:.25mm solid #999;padding:1mm 2mm;text-align:left;vertical-align:top;white-space:pre-line}
.a4 table.eq th{background:#d9d9d9}
.a4 .foot{margin-top:3mm;font:600 9.5pt var(--sans);text-transform:uppercase;text-align:center;border-top:.6mm solid #111;padding-top:2mm}
.a4 .un{margin-top:2.5mm;font-size:9.5pt}

@page{size:A4;margin:12mm}
@media print{
 body{background:#fff}
 body>*:not(#print){display:none!important}
 #print{position:static;width:auto}
 .a4{width:auto;padding:0;break-after:page;page-break-after:always}
 .a4.card{height:272mm}
 .a4.bill{min-height:0}
}
</style>
</head>
<body>
<header class="top">
 <h1>Station bill generator<span class="sub" id="shipline"></span></h1>
 <span id="saved">Saved</span>
 <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="l"></i></span>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
 <button data-tab="cards"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Cards</button>
 <button data-tab="bills"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M9 9v11"/></svg>Bills</button>
 <button data-tab="ranks"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5h5M16 9h5M18 13h3"/></svg>Crew</button>
 <button data-tab="scen"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Drills</button>
 <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
</nav>
<div id="print"></div>
<script>
{
/* ================= SEED DATA (from DUTIES & RESPONSIBILITIES 24 CREW with OSMC) ================= */
const CDECK='Muster Station: C-Deck (3rd Bridge Deck)',FS1='Fire Station No. 1: D-Deck, starboard side locker',FS2='Fire Station No. 2: Upper Deck, starboard side, inside accommodation',ECR='Engine Control Room',SOPEP='SOPEP Equipment Locker Area: front of accommodation, port side',SGR='Steering Gear Room',FCLE='Forecastle Deck',BRG='Bridge',RBS='Rescue Boat Station',DES='As designated by Team Leader';
const ROSTER=[['MA','Master','Deck',0],['CO','Chief Officer','Deck',0],['2O','2nd Officer','Deck',1],['3O','3rd Officer','Deck',1],['J3O','Junior 3rd Officer','Deck',1],['CDT','Officer Deck Cadet','Deck',0],['CE','Chief Engineer','Engine',0],['2E','2nd Engineer','Engine',1],['3E','3rd Engineer','Engine',1],['4E','4th Engineer','Engine',1],['ETO','Electrician','Engine',0],['AETO','Assistant Electrician','Engine',0],['BSN','Bosun','Deck',0],['DF','Deck Fitter','Deck',0],['AB1','AB1','Deck',1],['AB2','AB2','Deck',1],['OS1','OS1','Deck',1],['OS2','OS2','Deck',1],['OSMC','OS – Maintenance Crew (OS-MC)','Deck',0],['EF','Engine Fitter','Engine',0],['MM','Motorman','Engine',0],['CK','Chief Cook','Catering',0],['CA','Catering Assistant','Catering',0]].map(([id,name,dept,w])=>({id,name,dept,watch:!!w}));
let _n=0;const uid=()=>Date.now().toString(36)+(_n++).toString(36);
const M=(r,d,c,l)=>({r,d,c:c||'',l:l||''});
const W=(rs,d,c,l)=>rs.map(r=>M(r,d,c,l));
const T=(name,muster,task,lead,alt,members)=>({id:uid(),name,muster,task,lead:lead||'',alt:alt||'',members});
const OFF3=['2O','3O','J3O'],ENG3=['2E','3E','4E'],RAT=['AB1','AB2','OS1','OS2','OSMC'];
const FIRE_T1='Put on fireman\'s outfit and smoke-diving equipment.\nPrimary task: main fire-fighting and search and rescue team if fire is on deck or in accommodation. Perform rescue if emergency is on deck. Bring EEBD, additional CABA and torch light.\nSecondary task: assist Team No. 2 if fire or emergency is in the engine room.';
const FIRE_T2='Put on fireman\'s outfit and smoke-diving equipment.\nPrimary task: main fire-fighting and search and rescue team if fire is in the engine room. Perform rescue if emergency is in the engine room. Bring EEBD, additional CABA and torch light.\nSecondary task: assist Team No. 1 if fire or emergency is in accommodation or deck area.';
const FA_T='Bring stretchers, blankets, heart defibrillator and oxygen apparatus to the area, together with a first aid kit, and prepare for treatment.';
const FA_M='Report to Muster Station. Bring first aid equipment, stretcher, blankets and oxygen apparatus. Prepare to administer treatment.';
const ER_T='Meet at Engine Control Room. Man the engine room and await orders from the Bridge.';
const FA3=(t)=>T('First Aid Team',t===FA_T?DES:'',t,'2O','',[M('2O','Team Leader.'),M('CK','Assist as required.'),M('CA','Assist as required.')]);
const GEN_FOOT='When the general alarm sounds, all personnel including supernumeraries, passengers and visitors shall meet at the designated muster station.';
const DISP='At Master\'s / Chief Officer\'s disposal.';
const LB_INS='1. All personnel meet at the designated Lifeboat Muster Station (C-Deck), wearing suitable clothing.\n2. All personnel bring or wear lifejackets and immersion suits as appropriate before preparing the lifeboat for launching.\n3. The Lifeboat Commander is in charge of mustering, preparation and launching.\n4. Liferafts to be prepared if ordered by the Master.\n\nLifeboat drill: all personnel shall gain experience in all aspects of launching procedures.';
const BOAT_AL='7 short followed by 1 long blast on the ship\'s alarm system, followed by an announcement to evacuate on the PA system, by two-way radio and/or directly.';

function balance(el){const cs=el.querySelectorAll('.col');if(cs.length<2)return;const[c1,c2]=cs;while(c2.firstElementChild)c1.appendChild(c2.firstElementChild);
 const en=[...c1.children],hs=en.map(e=>e.offsetHeight),tot=hs.reduce((a,b)=>a+b,0);let best=0,bv=1e9,acc=0;for(let k=0;k<=en.length;k++){const v=Math.max(acc,tot-acc);if(v<bv){bv=v;best=k}acc+=hs[k]||0}en.slice(best).forEach(e=>c2.appendChild(e))}
function fitCard(el){
 el.classList.remove('f1','f2','f3','f4');
 const over=()=>{balance(el);const b=el.querySelector('.cbody');if(!b)return false;if(b.scrollHeight>b.clientHeight+1)return true;return [...b.querySelectorAll('.col')].some(c=>c.scrollHeight>c.clientHeight+1)};
 if(!over())return true;el.classList.add('f1');if(!over())return true;el.classList.add('f2');if(!over())return true;el.classList.add('f3');if(!over())return true;el.classList.add('f4');return !over()}

function teamRows(t){
 const rows=[],seen={};
 t.members.forEach(m=>{
  const key=m.l?('L|'+m.l+'|'+m.d+'|'+m.c):('R|'+m.r+'|'+m.d+'|'+m.c);
  if(m.l&&seen[key]){seen[key].ranks.push(m.r);return}
  const row={m,ranks:[m.r]};if(m.l)seen[key]=row;rows.push(row)});
 return rows.map(({m,ranks})=>{
  const lead=!m.l&&m.r===t.lead;
  let pos=(m.mu?'':'')+(m.l?`${esc(m.l)}<span class="rs">${ranks.map(rn).map(esc).join(', ')}${m.c?' · '+(m.c==='on'?'on watch':'off watch'):''}</span>`:esc(rn(m.r))+(m.c?`<span class="rs">${m.c==='on'?'If on watch':'If off watch'}</span>`:''))+(m.mu?`<span class="rs" style="font-weight:700;color:#111">${esc(m.mu)}</span>`:'');
  if(lead&&t.alt)pos+=`<span class="alt">Alt: ${esc(rn(t.alt))}</span>`;
  return `<tr><td class="${lead?'ld':''}">${pos}</td><td class="${lead?'ld':''}">${esc(m.d)}</td></tr>`}).join('')}

async function doPrint(pages,label){

  P.innerHTML='';
  try{await DL.save({filename:fname((label||'print')+' '+S.ship.name)+'.html',data:html});note('Print file saved. Open it in Safari or Chrome; the print screen opens by itself. Choose Print or Save as PDF.')}catch(e){note('The file was not saved. Tap the button again to retry.')}

/* ================= RENDER ================= */
const view=document.getElementById('view');
function render(keepScroll){
 const y=scrollY;
 document.getElementById('shipline').textContent=[S.ship.name,S.ship.call].filter(Boolean).join(' · ');
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));
 view.innerHTML={cards:vCards,bills:vBills,ranks:vRanks,scen:vScen,set:vSet}[V.tab]();
 requestAnimationFrame(layoutPreviews);
 if(keepScroll)scrollTo(0,y);else scrollTo(0,0)}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;V.tab=b.dataset.tab;V.rankEdit=null;V.scEdit=null;render()});

function objOf(ds){
 if(ds.set)return ds.set==='root'?S:S[ds.set];
 if(ds.r&&!ds.s)return rank(ds.r);
 const s=sc(ds.s);if(!s)return null;if(ds.t==null)return s;
 const t=s.teams[+ds.t];if(!t)return null;if(ds.m==null)return t;return t.members[+ds.m]}
function commit(el){
 const ds=el.dataset;if(!ds.f)return false;const o=objOf(ds);if(!o)return false;
 o[ds.f]=el.type==='checkbox'?el.checked:el.value;
 if(ds.f==='d'&&el.value.trim()&&!S.library.includes(el.value))S.library.push(el.value);
 save();return true}
view.addEventListener('input',e=>{
 const el=e.target,ds=el.dataset;
 if(ds.act==='libQ'){V.libQ=el.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{render(true);const q=document.getElementById('libQ');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},300);return}
 if(ds.act==='locEdit'){const old=S.locations[+ds.i];S.locations[+ds.i]=el.value;S.scenarios.forEach(s=>{if(s.muster===old)s.muster=el.value;s.teams.forEach(t=>{if(t.muster===old)t.muster=el.value})});save();return}
 if(ds.act==='eqHead'){S.equipment.head[+ds.i]=el.value;save();return}
 if(ds.act==='eqCell'){S.equipment.rows[+ds.i][+ds.c]=el.value;save();return}
 if(el.tagName!=='SELECT'&&el.type!=='checkbox'){commit(el);if(ds.cnt){const c=document.getElementById('cnt'),s=sc(ds.s),lim=s.group==='A'?320:180;c.textContent=`${el.value.length} / ${lim} suggested`;c.classList.toggle('over',el.value.length>lim)}}});
view.addEventListener('change',e=>{
 const el=e.target,ds=el.dataset;
 if(el.id==='impF'){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importJSON(rd.result);rd.readAsText(f);return}
 if(ds.act==='seat'){if(el.value)assignSeat(el.value,+ds.n);else{const o=seatOf(+ds.n);if(o)o.seat=''}save();return render(true)}
 if(ds.act==='rankSeat'){assignSeat(ds.r,el.value?+el.value:'');save();return render(true)}
 if(ds.re){commit(el);return render(true)}
 if(ds.act==='pickRank'){V.rank=el.value;return render(true)}
 if(ds.act==='pickBill'){V.bill=el.value;return render(true)}
 if(ds.act==='mvTeam'){const s=sc(ds.s),m=s.teams[+ds.t].members.splice(+ds.m,1)[0];s.teams[+el.value].members.push(m);save();return render(true)}
 if(ds.act==='setLead'||ds.act==='setAlt'){const s=sc(ds.s),k=ds.act==='setLead'?'lead':'alt';s.teams.forEach(t=>{if(t[k]===ds.r)t[k]=''});if(+el.value>=0)s.teams[+el.value][k]=ds.r;save();return render(true)}
 if(el.tagName==='SELECT'||el.type==='checkbox'){if(commit(el))render(true);return}
 if(ds.f==='d')commit(el)});
function arm(btn){if(btn.dataset.armed)return true;btn.dataset.armed='1';const t=btn.textContent;btn.textContent='Tap again to confirm';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=t}},3000);return false}
function importJSON(txt){const msg=document.getElementById('impMsg');try{const d=JSON.parse(txt);if(!d.roster||!d.scenarios||!d.ship)throw 0;S=Object.assign(clone(DEFAULTS),d);save();render();V.tab='set';render()}catch(e){if(msg)msg.textContent='That file is not a valid backup. Nothing was changed.'}}
view.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT')return;const ds=b.dataset,a=ds.act;
 const s=ds.s?sc(ds.s):null;
 switch(a){
 case 'card':V.card=ds.v;return render(true);
 case 'printCard':return doPrint(V.card==='both'?[cardHTML(V.rank,'A'),cardHTML(V.rank,'B')]:[cardHTML(V.rank,V.card)],'Duty card '+rn(V.rank));
 case 'printAllCards':return doPrint(allCards(),'All duty cards');
 case 'printBill':return doPrint([V.bill==='general'?generalHTML():V.bill==='seats'?seatPlanHTML():V.bill==='rafts'?raftPageHTML():billHTML(sc(V.bill))],V.bill==='general'?'General emergency instructions':V.bill==='seats'?'Lifeboat seat allocation':V.bill==='rafts'?'Liferaft allocation':'Station bill '+sc(V.bill).name);
 case 'autoSeat':{if(!arm(b))return;if(isFF())S.roster.forEach(r=>{r.seat=FF.seats[r.id]||''});else{let n=2;S.roster.forEach(r=>{r.seat=r.id==='CO'?1:n++})}save();return render(true)}
 case 'printAllBills':return doPrint(allBills(),'All station bills');
 case 'printEverything':return doPrint([...allBills(),...allCards()],'Station bills and duty cards');
 case 'editRank':V.tab='ranks';V.rankEdit=ds.r;return render();
 case 'genCard':V.tab='cards';V.rank=ds.r;V.card='both';V.rankEdit=null;return render();
 case 'back':V.rankEdit=null;V.scEdit=null;return render();
 case 'addRank':{const n=document.getElementById('nrName').value.trim();if(!n){document.getElementById('nrName').focus();return}const id='R'+uid();S.roster.push({id,name:n,dept:document.getElementById('nrDept').value,watch:false});save();V.rankEdit=id;return render()}
 case 'delRank':if(!arm(b))return;S.roster=S.roster.filter(r=>r.id!==ds.r);S.scenarios.forEach(x=>x.teams.forEach(t=>{t.members=t.members.filter(m=>m.r!==ds.r);if(t.lead===ds.r)t.lead='';if(t.alt===ds.r)t.alt=''}));save();return render(true);
 case 'mvRank':{const i=S.roster.findIndex(r=>r.id===ds.r),j=i+(+ds.d);if(j<0||j>=S.roster.length)return;[S.roster[i],S.roster[j]]=[S.roster[j],S.roster[i]];save();return render(true)}
 case 'addRole':{const sel=document.getElementById('add-'+ds.s);s.teams[+sel.value].members.push(M(ds.r,''));save();return render(true)}
 case 'delMem':s.teams[+ds.t].members.splice(+ds.m,1);save();return render(true);
 case 'addMem':s.teams[+ds.t].members.push(M(S.roster[0].id,''));save();return render(true);
 case 'addTeam':s.teams.push(T('New team','','','','',[]));save();return render(true);
 case 'delTeam':if(!arm(b))return;s.teams.splice(+ds.t,1);save();return render(true);
 case 'mvTeamPos':{const i=+ds.t;if(i<1)return;[s.teams[i-1],s.teams[i]]=[s.teams[i],s.teams[i-1]];save();return render(true)}
 case 'editSc':V.scEdit=ds.s;return render();
 case 'mvSc':{const i=+ds.i;if(i<1)return;[S.scenarios[i-1],S.scenarios[i]]=[S.scenarios[i],S.scenarios[i-1]];save();return render(true)}
 case 'addSc':{const n=SC({name:'New scenario',title:'Emergency plan – new scenario',teams:[T('Bridge Team',BRG,'Operation centre: central command and control.','MA','',[M('MA','In command of all operations.')])]});S.scenarios.push(n);save();V.scEdit=n.id;return render()}
 case 'delSc':if(!arm(b))return;S.scenarios=S.scenarios.filter(x=>x!==s);V.scEdit=null;save();return render();
 case 'pvBill':V.tab='bills';V.bill=s.id;V.scEdit=null;return render();
 case 'resetNotes':{if(!arm(b))return;const d=DEFAULTS.scenarios.find(x=>x.name===s.name)||DEFAULTS.scenarios[S.scenarios.indexOf(s)];if(d){['keyNote','immediate','instructions','footer'].forEach(k=>s[k]=d[k]);s.teams.forEach(t=>{const dt=d.teams.find(x=>x.name===t.name);if(dt)t.task=dt.task})}save();return render(true)}
 case 'addLoc':{const v=document.getElementById('newLoc').value.trim();if(!v)return;S.locations.push(v);save();return render(true)}
 case 'delLoc':if(!arm(b))return;S.locations.splice(+ds.i,1);save();return render(true);
 case 'addEq':S.equipment.rows.push(S.equipment.head.map(()=>''));save();return render(true);
 case 'delEq':S.equipment.rows.splice(+ds.i,1);save();return render(true);
 case 'addLib':{const v=document.getElementById('newLib').value.trim();if(v&&!S.library.includes(v))S.library.push(v);save();return render(true)}
 case 'delLib':S.library=S.library.filter(d=>d!==ds.v);if(allDuties().includes(ds.v)){const el=b.closest('.li');el.querySelector('.grow').textContent=ds.v+' (still assigned to a rank)';return}save();return render(true);
 case 'export':{if(framed&&DL){DL.save({filename:'station-bill-backup-'+new Date().toISOString().slice(0,10)+'.json',data:JSON.stringify(S,null,1)}).then(()=>note('Backup saved.'),()=>note('Backup not saved. Try again or use Copy backup text.'));return}const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='station-bill-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a2);a2.click();a2.remove();return}
 case 'copyExport':{const t=JSON.stringify(S);const ta=document.getElementById('impT');ta.value=t;try{navigator.clipboard.writeText(t).then(()=>document.getElementById('impMsg').textContent='Backup copied. Paste it into a note or email to keep it.',()=>document.getElementById('impMsg').textContent='Backup text is in the box below. Select all and copy.')}catch(e){document.getElementById('impMsg').textContent='Backup text is in the box below. Select all and copy.'}return}
 case 'importText':return importJSON(document.getElementById('impT').value);
 case 'resetAll':if(!arm(b))return;S=clone(DEFAULTS);S.library=allDuties();save();return render();
 }});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!framed){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
}
</script>
</body>
